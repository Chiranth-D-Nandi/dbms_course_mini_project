openapi: 3.0.3
info:
  title: Tatkal course project API
  version: 1.0.0
  description: Simulated payment and simplified refund policy. Canonical routes retain the exact trailing slash
    shown.
servers:
- url: http://127.0.0.1:8000/api
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      required:
      - email
      - password
    RegisterRequest:
      type: object
      properties:
        first_name:
          type: string
          maxLength: 50
        last_name:
          type: string
          maxLength: 50
        email:
          type: string
          format: email
        phone:
          type: string
          pattern: ^[0-9]{10}$
        password:
          type: string
          minLength: 6
        role:
          type: string
          enum:
          - CUSTOMER
          default: CUSTOMER
      required:
      - first_name
      - last_name
      - email
      - phone
      - password
    RefreshRequest:
      type: object
      properties:
        refresh:
          type: string
      required:
      - refresh
    Passenger:
      type: object
      properties:
        passenger_name:
          type: string
          maxLength: 100
        age:
          type: integer
          minimum: 1
          maximum: 120
        dob:
          type: string
          format: date
        gender:
          type: string
          enum:
          - MALE
          - FEMALE
          - OTHER
        id_card_type:
          type: string
          enum:
          - AADHAAR
          - PAN
          - PASSPORT
          - VOTER_ID
        id_card_number:
          type: string
          maxLength: 50
      required:
      - passenger_name
      - gender
      - id_card_type
      - id_card_number
      anyOf:
      - required:
        - age
      - required:
        - dob
    PaymentRequest:
      type: object
      properties:
        pnr:
          type: integer
          minimum: 1
        payment_method:
          type: string
          enum:
          - UPI
          - CARD
          - NETBANKING
          - CREDIT_CARD
          - DEBIT_CARD
          - NET_BANKING
        idempotency_key:
          type: string
          maxLength: 128
      required:
      - pnr
      - payment_method
    RunRequest:
      type: object
      properties:
        train_id:
          type: integer
          minimum: 1
        journey_date:
          type: string
          format: date
      required:
      - train_id
      - journey_date
    CancelRequest:
      type: object
      properties:
        reason:
          type: string
          maxLength: 500
      required: []
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
          required:
          - code
          - message
      required:
      - error
    BookingRequest:
      type: object
      properties:
        run_id:
          type: integer
          minimum: 1
        source_station_id:
          type: integer
          minimum: 1
        dest_station_id:
          type: integer
          minimum: 1
        class_code:
          type: string
          maxLength: 10
        booking_type:
          type: string
          enum:
          - GENERAL
          - TATKAL
        passengers:
          type: array
          minItems: 1
          maxItems: 6
          items:
            $ref: '#/components/schemas/Passenger'
      required:
      - run_id
      - source_station_id
      - dest_station_id
      - class_code
      - passengers
paths:
  /auth/register:
    post:
      summary: Create a customer account
      responses:
        '201':
          description: Success; see Markdown response contract
        '400':
          description: Invalid request
        '401':
          description: Authentication required
        '403':
          description: Permission denied
        '404':
          description: Resource not found
        '409':
          description: Conflict or booking rejected
        '429':
          description: Request rate exceeded
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
  /auth/login:
    post:
      summary: Log in and receive access/refresh tokens
      responses:
        '200':
          description: Success; see Markdown response contract
        '400':
          description: Invalid request
        '401':
          description: Authentication required
        '403':
          description: Permission denied
        '404':
          description: Resource not found
        '409':
          description: Conflict or booking rejected
        '429':
          description: Request rate exceeded
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
  /auth/refresh:
    post:
      summary: Refresh a session for an active account
      responses:
        '200':
          description: Success; see Markdown response contract
        '400':
          description: Invalid request
        '401':
          description: Authentication required
        '403':
          description: Permission denied
        '404':
          description: Resource not found
        '409':
          description: Conflict or booking rejected
        '429':
          description: Request rate exceeded
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
  /auth/me:
    get:
      summary: Read the authenticated user
      responses:
        '200':
          description: Success; see Markdown response contract
        '400':
          description: Invalid request
        '401':
          description: Authentication required
        '403':
          description: Permission denied
        '404':
          description: Resource not found
        '409':
          description: Conflict or booking rejected
        '429':
          description: Request rate exceeded
      security:
      - BearerAuth: []
  /stations/:
    get:
      summary: Search station code/name/city with q
      responses:
        '200':
          description: Success; see Markdown response contract
        '400':
          description: Invalid request
        '401':
          description: Authentication required
        '403':
          description: Permission denied
        '404':
          description: Resource not found
        '409':
          description: Conflict or booking rejected
        '429':
          description: Request rate exceeded
      parameters:
      - name: q
        in: query
        required: false
        schema:
          type: string
  /trains/:
    get:
      summary: List active train catalog
      responses:
        '200':
          description: Success; see Markdown response contract
        '400':
          description: Invalid request
        '401':
          description: Authentication required
        '403':
          description: Permission denied
        '404':
          description: Resource not found
        '409':
          description: Conflict or booking rejected
        '429':
          description: Request rate exceeded
  /trains/search/:
    get:
      summary: Search source/dest station code or ID and run date
      responses:
        '200':
          description: Success; see Markdown response contract
        '400':
          description: Invalid request
        '401':
          description: Authentication required
        '403':
          description: Permission denied
        '404':
          description: Resource not found
        '409':
          description: Conflict or booking rejected
        '429':
          description: Request rate exceeded
      parameters:
      - name: source
        in: query
        required: true
        schema:
          type: string
      - name: dest
        in: query
        required: true
        schema:
          type: string
      - name: date
        in: query
        required: true
        schema:
          type: string
  /trains/{id}/:
    get:
      summary: Read timetable, running days and coach count
      responses:
        '200':
          description: Success; see Markdown response contract
        '400':
          description: Invalid request
        '401':
          description: Authentication required
        '403':
          description: Permission denied
        '404':
          description: Resource not found
        '409':
          description: Conflict or booking rejected
        '429':
          description: Request rate exceeded
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
  /runs/{run_id}/seats/:
    get:
      summary: Read coach seat map by class and quota
      responses:
        '200':
          description: Success; see Markdown response contract
        '400':
          description: Invalid request
        '401':
          description: Authentication required
        '403':
          description: Permission denied
        '404':
          description: Resource not found
        '409':
          description: Conflict or booking rejected
        '429':
          description: Request rate exceeded
      parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: integer
      - name: class
        in: query
        required: false
        schema:
          type: string
      - name: quota
        in: query
        required: false
        schema:
          type: string
  /tatkal/status/:
    get:
      summary: Read opening status by run_id and class
      responses:
        '200':
          description: Success; see Markdown response contract
        '400':
          description: Invalid request
        '401':
          description: Authentication required
        '403':
          description: Permission denied
        '404':
          description: Resource not found
        '409':
          description: Conflict or booking rejected
        '429':
          description: Request rate exceeded
      parameters:
      - name: run_id
        in: query
        required: true
        schema:
          type: string
      - name: class
        in: query
        required: false
        schema:
          type: string
  /bookings/:
    post:
      summary: Atomically reserve seats for eight minutes
      responses:
        '201':
          description: Success; see Markdown response contract
        '400':
          description: Invalid request
        '401':
          description: Authentication required
        '403':
          description: Permission denied
        '404':
          description: Resource not found
        '409':
          description: Conflict or booking rejected
        '429':
          description: Request rate exceeded
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingRequest'
  /bookings/my/:
    get:
      summary: List the authenticated user bookings
      responses:
        '200':
          description: Success; see Markdown response contract
        '400':
          description: Invalid request
        '401':
          description: Authentication required
        '403':
          description: Permission denied
        '404':
          description: Resource not found
        '409':
          description: Conflict or booking rejected
        '429':
          description: Request rate exceeded
      security:
      - BearerAuth: []
  /bookings/{pnr}/:
    get:
      summary: Read owned booking or admin-accessible booking
      responses:
        '200':
          description: Success; see Markdown response contract
        '400':
          description: Invalid request
        '401':
          description: Authentication required
        '403':
          description: Permission denied
        '404':
          description: Resource not found
        '409':
          description: Conflict or booking rejected
        '429':
          description: Request rate exceeded
      security:
      - BearerAuth: []
      parameters:
      - name: pnr
        in: path
        required: true
        schema:
          type: integer
  /bookings/{pnr}/cancel/:
    post:
      summary: Cancel confirmed owned ticket or admin-accessible ticket
      responses:
        '200':
          description: Success; see Markdown response contract
        '400':
          description: Invalid request
        '401':
          description: Authentication required
        '403':
          description: Permission denied
        '404':
          description: Resource not found
        '409':
          description: Conflict or booking rejected
        '429':
          description: Request rate exceeded
      security:
      - BearerAuth: []
      parameters:
      - name: pnr
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelRequest'
  /payments/confirm/:
    post:
      summary: Confirm a simulated payment with idempotency protection
      responses:
        '200':
          description: Success; see Markdown response contract
        '400':
          description: Invalid request
        '401':
          description: Authentication required
        '403':
          description: Permission denied
        '404':
          description: Resource not found
        '409':
          description: Conflict or booking rejected
        '429':
          description: Request rate exceeded
      security:
      - BearerAuth: []
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        description: Required here or in request body; if both supplied they must match.
        schema:
          type: string
          maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentRequest'
  /search/trains/:
    get:
      summary: Semantic train search using q
      responses:
        '200':
          description: Success; see Markdown response contract
        '400':
          description: Invalid request
        '401':
          description: Authentication required
        '403':
          description: Permission denied
        '404':
          description: Resource not found
        '409':
          description: Conflict or booking rejected
        '429':
          description: Request rate exceeded
      parameters:
      - name: q
        in: query
        required: true
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: string
  /search/faq/:
    get:
      summary: Semantic project-policy search using q and optional category
      responses:
        '200':
          description: Success; see Markdown response contract
        '400':
          description: Invalid request
        '401':
          description: Authentication required
        '403':
          description: Permission denied
        '404':
          description: Resource not found
        '409':
          description: Conflict or booking rejected
        '429':
          description: Request rate exceeded
      parameters:
      - name: q
        in: query
        required: true
        schema:
          type: string
      - name: category
        in: query
        required: false
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: string
  /admin/revenue/:
    get:
      summary: 'ADMIN: revenue summary and per-run rows'
      responses:
        '200':
          description: Success; see Markdown response contract
        '400':
          description: Invalid request
        '401':
          description: Authentication required
        '403':
          description: Permission denied
        '404':
          description: Resource not found
        '409':
          description: Conflict or booking rejected
        '429':
          description: Request rate exceeded
      security:
      - BearerAuth: []
  /admin/audit-logs/:
    get:
      summary: 'ADMIN: latest trigger logs; filter entity/action'
      responses:
        '200':
          description: Success; see Markdown response contract
        '400':
          description: Invalid request
        '401':
          description: Authentication required
        '403':
          description: Permission denied
        '404':
          description: Resource not found
        '409':
          description: Conflict or booking rejected
        '429':
          description: Request rate exceeded
      security:
      - BearerAuth: []
      parameters:
      - name: entity
        in: query
        required: false
        schema:
          type: string
      - name: action
        in: query
        required: false
        schema:
          type: string
  /admin/reports/{metric}/:
    get:
      summary: 'ADMIN: occupancy or tatkal-demand'
      responses:
        '200':
          description: Success; see Markdown response contract
        '400':
          description: Invalid request
        '401':
          description: Authentication required
        '403':
          description: Permission denied
        '404':
          description: Resource not found
        '409':
          description: Conflict or booking rejected
        '429':
          description: Request rate exceeded
      security:
      - BearerAuth: []
      parameters:
      - name: metric
        in: path
        required: true
        schema:
          type: string
  /admin/runs/:
    post:
      summary: 'ADMIN: create a dated run and inventory'
      responses:
        '201':
          description: Success; see Markdown response contract
        '400':
          description: Invalid request
        '401':
          description: Authentication required
        '403':
          description: Permission denied
        '404':
          description: Resource not found
        '409':
          description: Conflict or booking rejected
        '429':
          description: Request rate exceeded
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunRequest'
  /admin/release-holds/:
    post:
      summary: 'ADMIN: run the expiry sweep'
      responses:
        '200':
          description: Success; see Markdown response contract
        '400':
          description: Invalid request
        '401':
          description: Authentication required
        '403':
          description: Permission denied
        '404':
          description: Resource not found
        '409':
          description: Conflict or booking rejected
        '429':
          description: Request rate exceeded
      security:
      - BearerAuth: []
